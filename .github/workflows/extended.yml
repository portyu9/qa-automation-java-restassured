name: extended

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/extended.yml"
  schedule:
    - cron: "17 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restassured-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-full-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_BASE_URL: https://jsonplaceholder.typicode.com
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-java21
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run full Maven lifecycle with API, WireMock, and container integration coverage
        run: mvn -B -ntp verify
      - name: Publish Java observability summary
        if: always()
        run: |
          mkdir -p reports
          {
            echo '### REST Assured · Java 21 full verify'
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo '- Local HTTP boundary: WireMock'
            echo '- Persistence boundary: PostgreSQL Testcontainers'
            echo '- Lifecycle: Surefire + Failsafe'
            echo "- Job status: \`${{ job.status }}\`"
            echo '- Evidence: Maven Surefire/Failsafe XML and text reports'
          } | tee reports/java21-extended-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload extended evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: restassured-java21-extended-evidence
          path: |
            reports/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14
