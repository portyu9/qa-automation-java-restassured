name: extended

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - ".mvn/wrapper/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".github/workflows/extended.yml"
  schedule:
    - cron: "17 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restassured-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java25-full-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-java25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Verify checksum-pinned Maven wrapper
        run: ./mvnw -v
      - name: Run full Maven lifecycle with local API and container integration coverage
        run: ./mvnw -B -ntp verify
      - name: Publish Java observability summary
        if: always()
        run: |
          mkdir -p reports
          {
            echo '### REST Assured · Java 25 full verify'
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo '- Maven: `3.9.16` via checksum-pinned Wrapper 3.3.4'
            echo '- API boundary: repository-owned dynamic-port WireMock fixtures'
            echo '- Persistence boundary: Testcontainers 2 + PostgreSQL 16.15'
            echo '- Lifecycle: Surefire + Failsafe'
            echo "- Job status: \`${{ job.status }}\`"
            echo '- Evidence: Maven Surefire/Failsafe XML and text reports'
          } | tee reports/java25-extended-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload extended evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restassured-java25-extended-evidence
          path: |
            reports/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14
