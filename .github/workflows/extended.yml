name: extended

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - ".mvn/wrapper/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".github/scripts/**"
      - ".github/workflows/extended.yml"
  schedule:
    - cron: "17 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restassured-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-java-full-verify:
    name: Java 17 minimum-runtime full verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-java17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Verify checksum-pinned Maven wrapper
        run: ./mvnw -v
      - name: Run full lifecycle including local HTTP and PostgreSQL integration contracts
        run: ./mvnw -B -ntp verify
      - name: Validate semantic Surefire and Failsafe evidence
        run: python3 .github/scripts/validate_maven_evidence.py --surefire-min 14 --failsafe-min 1
      - name: Publish minimum-runtime observability summary
        if: always()
        run: |
          mkdir -p reports
          {
            echo '### REST Assured · Java 17 minimum-runtime full verify'
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo '- Maven: `3.9.16` via checksum-pinned Wrapper 3.3.4'
            echo '- API boundary: repository-owned dynamic-port WireMock fixtures'
            echo '- Persistence boundary: Testcontainers 1.21.4 + PostgreSQL 16.15'
            echo '- Lifecycle: Surefire + Failsafe'
            echo "- Job status: \`${{ job.status }}\`"
            echo '- Evidence: at least 14 executed Surefire tests + 1 executed Failsafe test, zero failures/errors/skips'
          } | tee reports/java17-extended-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload extended evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restassured-java17-extended-evidence
          path: |
            reports/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: error
          retention-days: 14

  extended-gate:
    name: extended-gate
    if: always()
    needs: [minimum-java-full-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Evaluate extended lifecycle job
        env:
          MINIMUM_JAVA: ${{ needs.minimum-java-full-verify.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MINIMUM_JAVA" == "success" ]] || { echo "minimum-java-full-verify=$MINIMUM_JAVA"; exit 1; }
