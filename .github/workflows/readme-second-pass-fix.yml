name: readme-second-pass-fix

on:
  push:
    branches: [docs/readme-second-pass]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/readme-second-pass
      - name: Apply exact README wording corrections
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          expected = {
              'fixed HIGH/CRITICAL vulnerabilities': 2,
              'Fixed HIGH/CRITICAL vulnerability in the exact repository-built test image': 1,
              'Fixed HIGH/CRITICAL vulnerability exists in the resolved test dependency graph': 1,
              'Migrations that rename modules or Java packages require deliberate code changes. a future Testcontainers major': 1,
          }
          for phrase, count in expected.items():
              actual = text.count(phrase)
              if actual != count:
                  raise SystemExit(f'expected {count} matches for {phrase!r}, found {actual}')
          text = text.replace('fixed HIGH/CRITICAL vulnerabilities', 'fixable HIGH/CRITICAL vulnerabilities')
          text = text.replace('Fixed HIGH/CRITICAL vulnerability in the exact repository-built test image', 'Fixable HIGH/CRITICAL vulnerability in the exact repository-built test image')
          text = text.replace('Fixed HIGH/CRITICAL vulnerability exists in the resolved test dependency graph', 'Fixable HIGH/CRITICAL vulnerability exists in the resolved test dependency graph')
          text = text.replace('Migrations that rename modules or Java packages require deliberate code changes. a future Testcontainers major', 'Migrations that rename modules or Java packages require deliberate code changes. A future Testcontainers major')
          p.write_text(text, encoding='utf-8')
      - name: Commit wording corrections
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/readme-second-pass-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/workflows/readme-second-pass-fix.yml
          git commit -m 'docs: clarify README vulnerability semantics'
          git push origin HEAD:docs/readme-second-pass
