name: docs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Validate README contracts
        run: python .github/scripts/validate_readme.py

  generate-wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Calculate official Maven distribution SHA-256
        id: maven
        shell: bash
        run: |
          set -euo pipefail
          url='https://dlcdn.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.zip'
          curl --fail --silent --show-error --location "$url" --output "$RUNNER_TEMP/apache-maven-3.9.16-bin.zip"
          checksum="$(sha256sum "$RUNNER_TEMP/apache-maven-3.9.16-bin.zip" | awk '{print $1}')"
          printf 'sha256=%s\n' "$checksum" >> "$GITHUB_OUTPUT"
          printf '%s  apache-maven-3.9.16-bin.zip\n' "$checksum" > maven-distribution.sha256
      - name: Generate only-script Maven Wrapper
        run: >-
          mvn -B -ntp
          org.apache.maven.plugins:maven-wrapper-plugin:3.3.4:wrapper
          -Dtype=only-script
          -Dmaven=3.9.16
          -DdistributionSha256Sum=${{ steps.maven.outputs.sha256 }}
      - name: Verify wrapper version and checksum contract
        shell: bash
        run: |
          set -euo pipefail
          test -x ./mvnw
          grep -F 'apache-maven-3.9.16-bin.zip' .mvn/wrapper/maven-wrapper.properties
          grep -F "distributionSha256Sum=${{ steps.maven.outputs.sha256 }}" .mvn/wrapper/maven-wrapper.properties
          ./mvnw -v | tee wrapper-version.txt
          grep -F 'Apache Maven 3.9.16' wrapper-version.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maven-wrapper-3.9.16
          path: |
            mvnw
            mvnw.cmd
            .mvn/wrapper/maven-wrapper.properties
            maven-distribution.sha256
            wrapper-version.txt
          if-no-files-found: error
          retention-days: 1
