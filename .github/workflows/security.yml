name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 25 LTS
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Validate immutable workflow dependencies
        run: python3 .github/scripts/validate_workflow_pins.py
      - name: Verify checksum-pinned Maven wrapper
        run: ./mvnw -v
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          queries: security-extended
          build-mode: manual
      - name: Compile test framework for CodeQL
        run: ./mvnw -B -ntp -DskipTests test-compile
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  trivy:
    name: Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare evidence directory
        run: mkdir -p reports/security
      - name: Scan dependencies, configuration, and repository secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: reports/security/trivy.json
          exit-code: "1"
      - name: Require and summarize security evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="reports/security/trivy.json"
          summary="reports/security/summary.md"
          if [[ ! -s "$report" ]]; then
            printf '### Security gate\n\nTrivy did not produce a report. Treating missing scanner evidence as a gate failure.\n' | tee "$summary" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          jq -e '
            (.SchemaVersion == 2)
            and (.Trivy.Version == "0.74.0")
            and ((.Results // []) | type == "array")
            and (((.Results // []) | map(select(.Type == "pom" or ((.Target // "") | endswith("pom.xml")))) | length) > 0)
            and (((.Results // []) | map(select(.Type == "pom" or ((.Target // "") | endswith("pom.xml"))) | .Packages[]?) | length) > 1)
          ' "$report" >/dev/null
          vulnerabilities=$(jq '[.Results[]? | .Vulnerabilities[]?] | length' "$report")
          misconfigurations=$(jq '[.Results[]? | .Misconfigurations[]?] | length' "$report")
          secrets=$(jq '[.Results[]? | .Secrets[]?] | length' "$report")
          maven_packages=$(jq '[.Results[]? | select(.Type == "pom" or ((.Target // "") | endswith("pom.xml"))) | .Packages[]?] | length' "$report")
          {
            echo '### Open-source security gate'
            echo
            echo '| Signal | Findings |'
            echo '| --- | ---: |'
            echo "| Fixed HIGH/CRITICAL vulnerabilities | ${vulnerabilities} |"
            echo "| HIGH/CRITICAL misconfigurations | ${misconfigurations} |"
            echo "| Gated secret findings | ${secrets} |"
            echo "| Maven packages represented | ${maven_packages} |"
            echo
            echo '- Scanner: Trivy v0.74.0'
            echo '- Scope: repository filesystem, Maven production/test dependency graph, supported configuration files, and committed secret material'
            echo '- Policy: gated findings retain a nonzero scan result; missing/invalid JSON or a project-only Maven result fails the job'
          } | tee "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-security-evidence-${{ github.run_id }}
          path: reports/security/
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe GitHub Dependency graph
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" >/dev/null 2>&1; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'GitHub Dependency graph is available; running change-aware Dependency Review.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::GitHub Dependency graph is unavailable; the workflow-level Trivy HIGH/CRITICAL gate remains authoritative, but change-aware Dependency Review cannot run.'
            {
              echo '### Dependency Review fallback'
              echo
              echo 'GitHub Dependency graph is unavailable for this repository, so pull-request diff analysis cannot run.'
              echo 'The independent Trivy job still fails this security workflow on fixed HIGH/CRITICAL dependency findings, HIGH/CRITICAL supported misconfigurations, or gated secret findings. Enable Dependency graph in repository security settings to add the stronger change-aware review.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Confirm repository-wide fallback gate
        if: steps.dependency-graph.outputs.available != 'true'
        run: echo 'Dependency Review service unavailable; Trivy remains a required independent job in this workflow.'

  security-gate:
    name: security-gate
    if: always()
    needs: [codeql, trivy, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Evaluate security jobs
        env:
          CODEQL: ${{ needs.codeql.result }}
          TRIVY: ${{ needs.trivy.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          EVENT: ${{ github.event_name }}
          SAME_REPOSITORY_PR: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRIVY" == "success" ]] || { echo "trivy=$TRIVY"; exit 1; }
          if [[ "$SAME_REPOSITORY_PR" == "true" ]]; then
            [[ "$CODEQL" == "success" ]] || { echo "codeql=$CODEQL"; exit 1; }
          else
            [[ "$CODEQL" == "skipped" || "$CODEQL" == "success" ]] || { echo "codeql=$CODEQL"; exit 1; }
          fi
          if [[ "$EVENT" == "pull_request" ]]; then
            [[ "$DEPENDENCY_REVIEW" == "success" ]] || { echo "dependency-review=$DEPENDENCY_REVIEW"; exit 1; }
          else
            [[ "$DEPENDENCY_REVIEW" == "skipped" || "$DEPENDENCY_REVIEW" == "success" ]] || { echo "dependency-review=$DEPENDENCY_REVIEW"; exit 1; }
          fi
