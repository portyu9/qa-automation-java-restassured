name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-restassured-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Fast API and framework tests against repository-owned WireMock fixtures
        run: mvn -B -ntp -Pfast test
      - name: Full verification including local HTTP and container integration tests
        if: matrix.java == 17
        run: mvn -B -ntp verify
      - name: Publish CI observability summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p reports
          jq -n \
            --arg runId "$TEST_RUN_ID" \
            --arg status "$JOB_STATUS" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg java "${{ matrix.java }}" \
            '{schemaVersion:1,framework:"restassured-junit",runId:$runId,dimension:{java:$java,target:"local-wiremock"},status:$status,sha:$sha,ref:$ref}' \
            > "reports/ci-observability-java-${{ matrix.java }}.json"
          {
            echo "### REST Assured / JUnit · Java ${{ matrix.java }}"
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo '- API target: repository-owned dynamic-port WireMock fixture'
            echo '- Evidence: Surefire/Failsafe reports + request correlation diagnostics + CI observability envelope'
          } | tee "reports/ci-summary-java-${{ matrix.java }}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Maven test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: restassured-java-${{ matrix.java }}-reports
          path: |
            reports/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14
