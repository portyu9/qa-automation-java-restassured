name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-restassured-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_BASE_URL: https://jsonplaceholder.typicode.com
  TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Fast API and framework tests
        run: mvn -B -ntp -Pfast test
      - name: Full verification including integration tests
        if: matrix.java == 17
        run: mvn -B -ntp verify
      - name: Upload Maven test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restassured-java-${{ matrix.java }}-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14
