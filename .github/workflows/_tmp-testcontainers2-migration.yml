name: temporary Testcontainers 2 migration

on:
  push:
    branches: [deps/testcontainers-2]
    paths:
      - .github/workflows/_tmp-testcontainers2-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: deps/testcontainers-2
      - name: Apply exact Testcontainers 2 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "pom.xml",
              "<testcontainers.version>1.21.4</testcontainers.version>",
              "<testcontainers.version>2.0.5</testcontainers.version>",
          )
          replace_once(
              "pom.xml",
              "<groupId>org.testcontainers</groupId>\n      <artifactId>postgresql</artifactId>",
              "<groupId>org.testcontainers</groupId>\n      <artifactId>testcontainers-postgresql</artifactId>",
          )

          replace_once(
              "src/test/java/com/example/db/PostgresIntegrationTest.java",
              "import org.testcontainers.containers.PostgreSQLContainer;",
              "import org.testcontainers.postgresql.PostgreSQLContainer;",
          )
          replace_once(
              "src/test/java/com/example/db/PostgresIntegrationTest.java",
              "private static final PostgreSQLContainer<?> postgres = new PostgreSQLContainer<>(POSTGRES_DOCKER_IMAGE)",
              "private static final PostgreSQLContainer postgres = new PostgreSQLContainer(POSTGRES_DOCKER_IMAGE)",
          )

          replace_once(
              ".github/scripts/validate_postgres_runtime.py",
              '        "new PostgreSQLContainer<>(POSTGRES_DOCKER_IMAGE)",\n',
              '        "import org.testcontainers.postgresql.PostgreSQLContainer;",\n        "new PostgreSQLContainer(POSTGRES_DOCKER_IMAGE)",\n',
          )

          replace_once(
              ".github/workflows/security.yml",
              '            and (((.components // []) | map(select(.group == "org.testcontainers" and .name == "postgresql")) | length) > 0)\n',
              '            and (((.components // []) | map(select(.group == "org.testcontainers" and .name == "testcontainers-postgresql")) | length) > 0)\n            and (((.components // []) | map(select(.group == "org.testcontainers" and .name == "postgresql")) | length) == 0)\n',
          )

          replace_once(
              ".github/workflows/ci.yml",
              "Testcontainers 1.21.4 + PostgreSQL 16.15",
              "Testcontainers 2.0.5 + PostgreSQL 16.15",
          )
          replace_once(
              ".github/workflows/extended.yml",
              "Testcontainers 1.21.4 + PostgreSQL 16.15",
              "Testcontainers 2.0.5 + PostgreSQL 16.15",
          )

          replace_once(
              ".github/dependabot.yml",
              '    ignore:\n      - dependency-name: "org.testcontainers:*"\n        update-types: ["version-update:semver-major"]\n',
              "",
          )

          replace_once(
              ".github/dependency-governance.json",
              '"reason": "pom.xml co-locates dependency versions, shared family properties, BOM management, Maven plugin versions, runtime enforcement, and test lifecycle policy; Testcontainers major migration is also deliberately held. A bot-only Maven diff is therefore reviewed by humans instead of being represented as autonomously safe."',
              '"reason": "pom.xml co-locates dependency versions, shared family properties, BOM management, Maven plugin versions, runtime enforcement, and test lifecycle policy. A bot-only Maven diff is therefore reviewed by humans instead of being represented as autonomously safe."',
          )
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml \
            src/test/java/com/example/db/PostgresIntegrationTest.java \
            .github/scripts/validate_postgres_runtime.py \
            .github/workflows/security.yml \
            .github/workflows/ci.yml \
            .github/workflows/extended.yml \
            .github/dependabot.yml \
            .github/dependency-governance.json
          git diff --cached --exit-code && { echo 'migration produced no changes' >&2; exit 1; } || true
          git commit -m "deps: migrate Testcontainers PostgreSQL module to 2.0.5"
          git push origin HEAD:deps/testcontainers-2
